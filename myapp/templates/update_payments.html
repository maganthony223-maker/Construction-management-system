
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Payment</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <h1>UPDATE PAYMENT</h1>

    <p>Use this form to update payment details.</p>

    <form method="POST">
        {% csrf_token %}

        <label for="project">Select Project:</label>
        <select id="project" name="Project" required>

            {% for project in projects %}
                <option value="{{ project.id }}"
                    {% if payment.Project_id == project.id %}selected{% endif %}>
                    {{ project.ProjectName }}
                </option>
            {% endfor %}

        </select>

        <label for="amount">Amount Paid (UGX):</label>
        <input type="number" id="amount" name="AmountPaid"
               value="{{ payment.AmountPaid }}"
               min="0" step="0.01" required>

        <label for="date">Payment Date:</label>
        <input type="date" id="date" name="PaymentDate"
               value="{{ payment.PaymentDate|date:'Y-m-d' }}" required>

        <label for="method">Payment Method:</label>
        <select id="method" name="PaymentMethod" required>
            <option value="Cash" {% if payment.PaymentMethod == "Cash" %}selected{% endif %}>Cash</option>
            <option value="Bank Transfer" {% if payment.PaymentMethod == "Bank Transfer" %}selected{% endif %}>Bank Transfer</option>
            <option value="Cheque" {% if payment.PaymentMethod == "Cheque" %}selected{% endif %}>Cheque</option>
            <option value="Mobile Money" {% if payment.PaymentMethod == "Mobile Money" %}selected{% endif %}>Mobile Money</option>
        </select>

        <button type="submit">Update Payment</button>

    </form>

    <p>
        <a href="{% url 'payments' %}">Back to Payments</a>
    </p>

</body>
</html>
