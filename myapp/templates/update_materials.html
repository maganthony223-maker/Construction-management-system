<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Material</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <h1>UPDATE MATERIAL</h1>

    <p>Use this form to update material details.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Material Name:</label>
        <input type="text" name="MaterialName"
               value="{{ material.MaterialName }}" required>

        <label>Unit Price:</label>
        <input type="number" name="UnitPrice"
               value="{{ material.UnitPrice }}"
               min="0" step="0.01" required>

        <label>Quantity in Stock:</label>
        <input type="number" name="QuantityInStock"
               value="{{ material.QuantityInStock }}"
               min="0" required>

        <label>Select Supplier:</label>
        <select name="Supplier" required>
            {% for supplier in suppliers %}
                <option value="{{ supplier.id }}"
                    {% if material.Supplier_id == supplier.id %}selected{% endif %}>
                    {{ supplier.SupplierName }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Update Material</button>

    </form>

    <p>
        <a href="{% url 'materials' %}">Back to Materials</a>
    </p>

</body>
</html>
